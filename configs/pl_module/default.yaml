# configs/pl_module/default.yaml
# BASE config: all regularizers OFF by default (vanilla baseline)
# Use configs/variant/*.yaml to enable specific losses
_target_: faithful_cond_gen.pl_modules.generator_pl.GeneratorPLConfig

lr: 1e-4
weight_decay: 0.0
warmup_steps: 1000

# Condition dropout for compositional generalization
# - 0.0: No dropout (default, vanilla baseline)
# - 0.1-0.2: Moderate compositional learning
# - 0.3-0.5: Strong compositional learning (marginal models)
cond_dropout_prob: 0.0

# Additivity loss for compositional generalization
# Enforces v(c_full) ≈ v(c_drop_i) + v(c_drop_j) - v(c_drop_ij) via inclusion-exclusion
additivity_loss_weight: 0.0  # OFF by default (vanilla baseline)
additivity_loss_prob: 0.25   # Apply to 25% of batches when enabled
additivity_t_threshold: 0.7  # Only apply when t > 0.7 (high noise, conditioning dominates)

# Attribute-delta consistency loss (future)
attr_delta_loss_weight: 0.0  # OFF by default
attr_delta_loss_prob: 0.1    # Apply to 10% of batches when enabled

# Relational loss (future)
relational_loss_weight: 0.0  # OFF by default

# Optional: Fixed targets for the validation buffer logic
val_target_conditions: null
