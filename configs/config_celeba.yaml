# configs/config.yaml
defaults:
  - dataset: celeba        # celeba, rxrx1
  - model: generator_celeba # generator_celeba, generator_rxrx1
  - pl_module: default     # GeneratorPL settings (lr, etc)
  - train: default_celeba           # Trainer settings (50 batches)
  - eval: rfid
  - logger: wandb_celeba          # WandB Logger
  - callbacks: checkpoint # Checkpoint Callback
  - _self_

seed: 1337
device: cuda