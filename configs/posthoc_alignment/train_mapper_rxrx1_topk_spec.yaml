defaults:
  - train_mapper
  - _self_

model_key: rxrx1_vanilla_full_v1
hidden_dir: outputs/posthoc_alignment/raw_hidden/rxrx1_vanilla_full_v1
siglip_path: outputs/real_rxrx1_siglip_meanpatch_full/train_features.pt
output_dir: outputs/posthoc_alignment/mappers_topk_cov
condition_keys: [cell_type_id, sirna_id]

training:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 512
  epochs: 30
  val_fraction: 0.05
  seed: 42

loss:
  kind: topk_cov
  beta: 1.0
  gamma: 0.5
  top_k: 40
  gamma_warmup_frac: 0.33
  # legacy fields kept so the parent defaults merge doesn't trip on missing keys
  lambda_mse: 0.0
  lambda_var: 0.0
  lambda_cov: 0.0
  var_thresh: 0.0
