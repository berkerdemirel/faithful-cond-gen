defaults:
  - train_mapper
  - _self_

model_key: rxrx1_repa_full_v1
hidden_dir: outputs/posthoc_alignment/raw_hidden/rxrx1_repa_full_v1
siglip_path: outputs/real_rxrx1_dinov3_meanpatch/train_features.pt
output_dir: outputs/posthoc_alignment/mappers_norm_align_whit
condition_keys: [cell_type_id, sirna_id]

mapper:
  in_dim: 768
  out_dim: 1024
  hidden_dim: 2048

training:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 512
  epochs: 30
  val_fraction: 0.05
  seed: 42

loss:
  kind: norm_align
  lambda_pair: 1.0
  lambda_mu: 0.1
  lambda_cov: 0.1
  lambda_cls: 0.1
  class_label: cell_type_id
  eta_whit: 0.01
  whit_cond: 100.0
  lambda_mse: 0.0
  lambda_var: 0.0
  var_thresh: 0.0
