# configs/config_celeba_2attr_shared.yaml
# Baseline: 2-attribute CelebA with shared modulation
defaults:
  - dataset: celeba_2attr
  - model: generator_celeba_2attr_shared
  - pl_module: default
  - train: ablation_2attr
  - eval: rfid
  - logger: wandb_celeba
  - callbacks: checkpoint
  - _self_

seed: 1337
device: cuda

# Override logger name for this experiment
logger:
  name: celeba_2attr_shared_modulation
  project: faithful-cond-gen
  save_dir: ./outputs/wandb
