# configs/train/train_rxrx1.yaml
_target_: pytorch_lightning.Trainer

accelerator: gpu
devices: 8
strategy: ddp
num_nodes: 1

# Training Duration
max_steps: 400000
max_epochs: -1        # -1 means infinite epochs, stops at max_steps

# Optimization
gradient_clip_val: 1.0

# Logging & Checkpointing
log_every_n_steps: 50
enable_checkpointing: true
default_root_dir: "./outputs/celeba_run"

# Validation loop settings (optional limits)
limit_val_batches: 1.0 # 1.0 = Use full validation set
check_val_every_n_epoch: 1