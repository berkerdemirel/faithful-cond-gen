# configs/model/generator.yaml
_target_: faithful_cond_gen.model.generator.GeneratorConfig

image_size: 256
in_channels: 3            # RGB for CelebA

vae_model_name: "stabilityai/sd-vae-ft-mse"
vae_freeze: true

sit_arch: "SiT-B/2"       # Use smaller patch size (2) for 64x64 img
attr_num_classes: [2, 2, 2, 2] # Placeholder; script will auto-update this if needed

# Class dropout for Classifier-Free Guidance (CFG)
# - Drops ENTIRE condition → (UNCOND, UNCOND, ...) during training
# - Enables guidance: v = v_uncond + cfg_scale * (v_cond - v_uncond)
# - Different from cond_dropout_prob in pl_module (which drops individual attributes)
class_dropout_prob: 0.1

path_type: "linear"
checkpoint: null

# REPA (Representation Alignment) loss settings
# - Aligns intermediate SiT features with frozen pretrained encoder features
# - Disabled by default for vanilla baseline
use_repa: false
repa_encoder: "dinov3-vit-l"  # dinov2-vit-{s,b,l} or dinov3-vit-l (1024-dim for celeba_repa checkpoints)
repa_proj_coeff: 0.0          # OFF by default (vanilla baseline); set 0.5 for REPA
repa_encoder_depth: 8         # SiT layer to extract features from
repa_projector_dim: 2048      # Intermediate dimension for projector MLP