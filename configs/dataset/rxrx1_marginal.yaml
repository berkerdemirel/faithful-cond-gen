# conf/dataset/rxrx1_marginal.yaml
# RxRx1 dataset config for marginal model training
# Excludes top 100 (cell_type, perturbation) pairs from training (moves them to validation)

_target_: faithful_cond_gen.data.rxrx1.RxRx1DataConfig

data_dir: /mnt/pvc/AutoSync/data/rxrx1
img_size: [512, 512]
resize: [256, 256]
reduce_channels: false
augment_train: false
normalize: false
use_numpy: true
use_parquet: false
batch_size: 2
num_workers: 2
val_size: 0.1
seed: 1337

# composition logic
rare_threshold: 20

# Top 100 (cell_type, perturbation) pairs held out from training
# These pairs will be excluded from training and added to validation
# Format: [cell_type_id, sirna_id] where cell_type_id: HEPG2=0, HUVEC=1, RPE=2, U2OS=3
