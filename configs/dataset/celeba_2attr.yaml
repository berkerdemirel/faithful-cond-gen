# configs/dataset/celeba_2attr.yaml
# 2-attribute CelebA for conditioning ablation: Male, Smiling
# Compositional generalization test: train on (0,0), (0,1), (1,0), test on (1,1)
_target_: faithful_cond_gen.data.celeba.CelebaDataConfig

cache_dir: /mnt/pvc/AutoSync/data/celeba_cache
image_size: [224, 224]
augment_train: true
normalize: true
batch_size: 16          # Per GPU
num_workers: 4
rare_threshold: 50

# Select only 2 attributes for quick ablation
selected_attrs: ["Male", "Smiling"]

# Hold out (Male=1, Smiling=1) combination for compositional generalization testing
# Train on: (0,0), (0,1), (1,0)
# Test on: (1,1) - unseen combination
held_out_combos:
  - [1, 1]
