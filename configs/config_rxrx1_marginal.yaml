# configs/config_rxrx1_marginal.yaml
# Main config for training marginal model on RxRx1
# Excludes top 100 (cell_type, perturbation) pairs from training

defaults:
  - dataset: rxrx1_marginal
  - model: generator_rxrx1
  - pl_module: default
  - variant: compositional    # vanilla, repa, compositional, repa_compositional
  - train: default_rxrx1
  - callbacks: checkpoint
  - logger: wandb_rxrx1_marginal
  - _self_

seed: 1337
