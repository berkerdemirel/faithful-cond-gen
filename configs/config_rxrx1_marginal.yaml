# configs/config_rxrx1_marginal.yaml
# Main config for training marginal model on RxRx1
# Excludes top 100 (cell_type, perturbation) pairs from training

defaults:
  - dataset: rxrx1_marginal  # Use marginal dataset config with held_out_pairs
  - model: generator_rxrx1    # generator_celeba, generator_rxrx1
  - pl_module: default        # Lightning module
  - train: default_rxrx1      # Trainer settings
  - callbacks: checkpoint     # Checkpointing
  - logger: wandb_rxrx1_marginal       # WandB Logger
  - _self_

# Override specific settings if needed
seed: 1337
