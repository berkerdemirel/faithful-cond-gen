# @package _global_
# configs/variant/compositional.yaml
# Compositional regularization for marginal/stress-test models

model:
  use_repa: false
  repa_proj_coeff: 0.0

pl_module:
  cond_dropout_prob: 0.2
  additivity_loss_weight: 1.0
  additivity_loss_prob: 0.25
  additivity_t_threshold: 0.7
  attr_delta_loss_weight: 0.0
  relational_loss_weight: 0.0
