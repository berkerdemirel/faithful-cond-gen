# @package _global_
# configs/variant/relational.yaml
# REPA + relational alignment (full teacher stack)

model:
  use_repa: true
  repa_encoder: "dinov3-vit-b"
  repa_proj_coeff: 0.5
  repa_encoder_depth: 8

pl_module:
  cond_dropout_prob: 0.2
  additivity_loss_weight: 1.0
  additivity_loss_prob: 0.25
  additivity_t_threshold: 0.7
  attr_delta_loss_weight: 0.0
  relational_loss_weight: 0.1
