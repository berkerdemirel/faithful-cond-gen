defaults:
  - dataset: celeba       # Override at CLI
  - model: generator_celeba # Override at CLI
  - _self_

# Checkpoint: use registry key (preferred) or raw path (fallback)
# Available keys: celeba_vanilla_full_v1, celeba_vanilla_marginal_v1, rxrx1_vanilla_full_v1, rxrx1_vanilla_marginal_v1
checkpoint_key: celeba_vanilla_marginal_v1
# checkpoint_key: celeba_vanilla_full_v1
ckpt_path: null  # fallback if checkpoint_key not set

# Output
output_dir: "outputs/generated_celeba_marginalmodel"
# output_dir: "outputs/generated_celeba_fullmodel"

# Generation params
samples_per_condition: 1000 # 1000 for CelebA, 50 for RxRx1
batch_size: 128

# Sampling params (REPA-style + CFG)
num_inference_steps: 250
t_cutoff: 0.04

# Classifier-Free Guidance (NEW)
# - 1.0: No guidance (default, backward compatible)
# - 1.5-2.5: Moderate guidance (better quality)
# - 3.0+: Strong guidance (may over-saturate)
cfg_scale: 1.0

# Adaptive CFG (uses condition frequency statistics)
# - false: Use fixed cfg_scale for all samples
# - true: Automatic per-condition scaling (rare conditions get higher CFG)
adaptive_cfg: false

# DDP
num_gpus: 8