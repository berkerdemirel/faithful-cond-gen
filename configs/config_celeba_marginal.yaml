# configs/config_celeba_marginal.yaml
# Main config for training marginal model on CelebA
# Excludes all attribute combinations except single-attribute ones from training

defaults:
  - dataset: celeba_marginal
  - model: generator_celeba
  - pl_module: default
  - variant: compositional    # vanilla, repa, compositional, repa_compositional
  - train: default_celeba
  - callbacks: checkpoint
  - logger: wandb_celeba_marginal
  - _self_

seed: 1337
